name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t smart-internship .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag smart-internship ${{ secrets.DOCKERHUB_USERNAME }}/smart-internship:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smart-internship:latest

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/smart-internship:latest
            docker stop smart-attachment-app
            docker rm smart-attachment-app
            docker run -d --name smart-attachment-app -p 8080:8080 --network <your-network-name> -e SPRING_DATASOURCE_URL=jdbc:postgresql://smart-attachment-db:5432/<dbname> -e SPRING_DATASOURCE_USERNAME=<user> -e SPRING_DATASOURCE_PASSWORD=<password> ${{ secrets.DOCKERHUB_USERNAME }}/smart-internship:latest