<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password - Smart Internship</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.jpg}">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
            background:#eef2f7;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .card{
            background:#fff;
            border-radius:18px;
            box-shadow:0 12px 30px rgba(0,0,0,.08);
            max-width:420px;
            width:100%;
            overflow:hidden;
        }
        .card-header{
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            color:#fff;
            padding:28px 30px;
        }
        .card-header h2{ font-size:22px; margin-bottom:6px; }
        .card-header p{ font-size:14px; opacity:.85; }
        .card-body{ padding:30px; }
        .alert{
            padding:12px 16px;
            border-radius:10px;
            margin-bottom:20px;
            font-size:14px;
            font-weight:600;
        }
        .alert-info{ background:#dbeafe; color:#1e40af; }
        label{
            display:block;
            font-size:13px;
            font-weight:600;
            color:#374151;
            margin-bottom:6px;
        }
        input{
            width:100%;
            padding:12px 14px;
            border:1px solid #d5dce6;
            border-radius:10px;
            font-size:14px;
            margin-bottom:18px;
            outline:none;
        }
        input:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 3px rgba(37,99,235,.12);
        }
        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
            color:#fff;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
        }
        .back-link{
            display:block;
            text-align:center;
            margin-top:18px;
            color:#2563eb;
            font-weight:600;
            text-decoration:none;
            font-size:14px;
        }
        .back-link:hover{ text-decoration:underline; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h2>Forgot Password</h2>
        <p>We'll email you a reset link</p>
    </div>
    <div class="card-body">
        <div class="alert alert-info" th:if="${message != null}" th:text="${message}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="you@example.com" />
            <button type="submit">Send Reset Link</button>
        </form>

        <a th:href="@{/login}" class="back-link">&larr; Back to Login</a>
    </div>
</div>

</body>
</html>
