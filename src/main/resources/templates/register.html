<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.jpg}">
    <title>Register - Smart Internship Platform</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .card{
            background:#fff;
            width:100%;
            max-width:450px;
            padding:40px;
            border-radius:20px;
            box-shadow:0 20px 45px rgba(0,0,0,.25);
            animation:fadeIn .5s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h2{
            text-align:center;
            color:#1e3a8a;
            font-size:30px;
            margin-bottom:30px;
            font-weight:700;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#374151;
            font-weight:600;
            font-size:14px;
        }

        input,
        select{
            width:100%;
            padding:14px 15px;
            border:1px solid #d1d5db;
            border-radius:10px;
            font-size:15px;
            outline:none;
            transition:.3s;
            background:#fff;
        }

        input:focus,
        select:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,.15);
        }

        input::placeholder{
            color:#9ca3af;
        }

        button{
            width:100%;
            padding:15px;
            margin-top:10px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
            color:#fff;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 25px rgba(37,99,235,.30);
        }

        button:active{
            transform:translateY(0);
        }

        .link{
            text-align:center;
            margin-top:25px;
            color:#6b7280;
            font-size:15px;
        }

        .link a{
            color:#2563eb;
            text-decoration:none;
            font-weight:600;
        }

        .link a:hover{
            text-decoration:underline;
        }

        #skillsGroup{
            transition:all .3s ease;
        }

        @media(max-width:480px){

            .card{
                padding:30px 25px;
            }

            h2{
                font-size:26px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Platform Registration</h2>
    <form th:action="@{/register}" method="post">
        <div th:if="${param.error}" style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
            This email is already registered. Please log in or use a different email.
        </div>
        <!-- NEW: Role Selection -->
        <div class="form-group">
            <label>I am registering as a:</label>
            <select name="role" id="roleSelect" onchange="toggleSkills()" required>
                <option value="STUDENT">Student / Applicant</option>
                <option value="RECRUITER">Organization / Recruiter</option>
            </select>
        </div>

        <div class="form-group">
            <label>Full Name or Company Name:</label>
            <input type="text" name="name" required />
        </div>
        <div class="form-group">
            <label>Email Address:</label>
            <input type="email" name="email" required />
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" required />
        </div>

        <!-- This div will be hidden for recruiters via JavaScript -->
        <div class="form-group" id="skillsGroup">
            <label>My Skills (comma separated):</label>
            <input type="text" name="skills" placeholder="Java, Spring Boot, SQL" />
        </div>

        <button type="submit">Register</button>
    </form>
    <div class="link">
        Already have an account? <a href="/login">Login here</a>
    </div>
</div>

<script>
    function toggleSkills() {
        var role = document.getElementById("roleSelect").value;
        var skillsGroup = document.getElementById("skillsGroup");
        if (role === "RECRUITER") {
            skillsGroup.style.display = "none";
        } else {
            skillsGroup.style.display = "block";
        }
    }
</script>
</body>
</html>
