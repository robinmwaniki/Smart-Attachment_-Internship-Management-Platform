<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.jpg}">
    <title>Login - Smart Internship Platform</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }



        .card{
            width:100%;
            max-width:420px;
            background:#ffffff;
            padding:40px;
            border-radius:20px;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
            animation:fadeIn .5s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h2{
            text-align:center;
            color:#1e3c72;
            margin-bottom:30px;
            font-size:30px;
            font-weight:700;
        }



        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#444;
            font-weight:600;
            font-size:14px;
        }

        input{
            width:100%;
            padding:14px 16px;
            border:1px solid #d9d9d9;
            border-radius:10px;
            font-size:15px;
            transition:.3s;
            outline:none;
        }

        input:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,.15);
        }



        button{
            width:100%;
            padding:14px;
            margin-top:10px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
            color:#fff;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(37,99,235,.35);
        }



        .error{
            background:#fee2e2;
            color:#b91c1c;
            padding:12px;
            border-radius:10px;
            text-align:center;
            margin-bottom:20px;
            font-size:14px;
            border:1px solid #fecaca;
        }

        .success{
            background:#dcfce7;
            color:#166534;
            padding:12px;
            border-radius:10px;
            text-align:center;
            margin-bottom:20px;
            font-size:14px;
            border:1px solid #bbf7d0;
        }



        .link{
            text-align:center;
            margin-top:25px;
            color:#555;
            font-size:15px;
        }

        .link a{
            color:#2563eb;
            font-weight:600;
            text-decoration:none;
            transition:.3s;
        }

        .link a:hover{
            color:#1d4ed8;
            text-decoration:underline;
        }



        @media(max-width:480px){

            .card{
                padding:30px 25px;
            }

            h2{
                font-size:26px;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Login into your account</h2>
    <div th:if="${param.error}" class="error">Invalid email or password.</div>
    <div th:if="${param.logout}" style="color: green; text-align: center; margin-bottom: 10px; font-size: 14px;">You have been logged out successfully.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Email Address:</label>
            <input type="email" name="username" required />
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" required />
        </div>
        <button type="submit">Login</button>
    </form>
    <div class="link">
        Don't have an account? <a href="/register">Register here</a>
    </div>
</div>
</body>
</html>
