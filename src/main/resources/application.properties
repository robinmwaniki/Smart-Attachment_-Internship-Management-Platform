spring.application.name=Smart Attachment_ Internship Management Platform

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Bound SMTP network operations so a stalled mail server cannot hold request threads.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,bulkheads,bulkheadevents
management.endpoint.health.show-details=never
management.health.circuitbreakers.enabled=true

management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

africastalking.api-key=${AFRICASTALKING_API_KEY:}
africastalking.username=${AFRICASTALKING_USERNAME:sandbox}

# Keycloak validates access-token signature, issuer, expiry and API audience.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/smart-attachment}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/smart-attachment/protocol/openid-connect/certs}
keycloak.api-audience=${KEYCLOAK_API_AUDIENCE:smart-attachment-api}

# Resilience4j guards only the outbound SMTP and Africa's Talking boundaries.
# Sending notifications is non-idempotent, so no automatic retry is configured.
resilience4j.circuitbreaker.instances.emailGateway.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.emailGateway.slidingWindowSize=5
resilience4j.circuitbreaker.instances.emailGateway.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.emailGateway.failureRateThreshold=50
resilience4j.circuitbreaker.instances.emailGateway.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.emailGateway.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.emailGateway.registerHealthIndicator=true
resilience4j.bulkhead.instances.emailGateway.maxConcurrentCalls=5
resilience4j.bulkhead.instances.emailGateway.maxWaitDuration=0

resilience4j.circuitbreaker.instances.smsGateway.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.smsGateway.slidingWindowSize=5
resilience4j.circuitbreaker.instances.smsGateway.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.smsGateway.failureRateThreshold=50
resilience4j.circuitbreaker.instances.smsGateway.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.smsGateway.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.smsGateway.registerHealthIndicator=true
resilience4j.bulkhead.instances.smsGateway.maxConcurrentCalls=5
resilience4j.bulkhead.instances.smsGateway.maxWaitDuration=0
